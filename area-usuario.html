<!DOCTYPE html>

<html lang="pt-br">

<head>

<!-- ===================================================== -->
<!-- CONFIGURAÇÕES DA PÁGINA                              -->
<!-- ===================================================== -->

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Área do Cliente | StarCar Premium</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">


<link rel="stylesheet" href="css/style.css">


</head>

<body>

<!-- ===================================================== -->
<!-- MENU DE NAVEGAÇÃO                                    -->
<!-- ===================================================== -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">

            🚗 StarCar Premium

        </a>

    </div>

</nav>

<!-- ===================================================== -->
<!-- ÁREA DO USUÁRIO                                      -->
<!-- ===================================================== -->

<div class="container mt-5">

    <!-- Mensagem de boas-vindas -->
    <h1 id="boasVindas"
        class="text-center">

    </h1>

    <hr>

    <h2 class="text-center mb-4">

        Catálogo de Veículos

    </h2>

    <!-- Cards gerados pelo JavaScript -->
    <div id="catalogo"
         class="row">

    </div>

    <div class="text-center mt-5">

        <button
            class="btn btn-danger"
            onclick="sair()">

            Sair

        </button>

    </div>

</div>

<!-- ===================================================== -->
<!-- RODAPÉ                                               -->
<!-- ===================================================== -->

<footer
    class="bg-dark text-white text-center p-4 mt-5">

    <p>

        © 2026 StarCar Premium

    </p>

    <p>

        Sistema de gerenciamento de veículos.

    </p>

</footer>

<!-- ===================================================== -->
<!-- JAVASCRIPT                                           -->
<!-- ===================================================== -->

<script>

    /*
    =====================================================
    PROTEÇÃO DE ACESSO
    =====================================================

    Verifica se existe uma sessão ativa.

    Caso não exista, redireciona para login.
    */

    if(!sessionStorage.getItem("token")){

        window.location.href =
        "login.html";

    }

    /*
    =====================================================
    BOAS-VINDAS
    =====================================================
    */

    let usuario =

    sessionStorage.getItem(
        "usuario"
    );

    document
    .getElementById("boasVindas")
    .innerHTML =

    "Bem-vindo, " + usuario + "!";


    /*
    =====================================================
    RECUPERA VEÍCULOS
    =====================================================
    */

    let veiculos =

    JSON.parse(
        localStorage.getItem("veiculos")
    ) || [];


    let catalogo =

    document.getElementById(
        "catalogo"
    );


    /*
    =====================================================
    LISTA VEÍCULOS
    =====================================================
    */

    if(veiculos.length === 0){

        catalogo.innerHTML =

        `
        <div class="alert alert-warning">

            Nenhum veículo cadastrado.

        </div>
        `;

    }

    else{

        veiculos.forEach(function(veiculo){

            catalogo.innerHTML +=

            `
            <div class="col-md-4">

                <div class="card shadow mb-4">

                    <div class="card-body">

                        <h4>

                            ${veiculo.modelo}

                        </h4>

                        <hr>

                        <p>

                            <strong>Marca:</strong>
                            ${veiculo.marca}

                        </p>

                        <p>

                            <strong>Ano:</strong>
                            ${veiculo.ano}

                        </p>

                        <p>

                            <strong>Cor:</strong>
                            ${veiculo.cor}

                        </p>

                        <p>

                            <strong>Preço:</strong>
                            R$ ${veiculo.preco}

                        </p>

                        <p>

                            <strong>KM:</strong>
                            ${veiculo.km}

                        </p>

                        <p>

                            <strong>Categoria:</strong>
                            ${veiculo.categoria}

                        </p>

                    </div>

                </div>

            </div>
            `;

        });

    }


    /*
    =====================================================
    LOGOUT
    =====================================================

    Remove a sessão do usuário.
    */

    function sair(){

        sessionStorage.clear();

        window.location.href =
        "login.html";

    }

</script>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
```

</body>

</html>
