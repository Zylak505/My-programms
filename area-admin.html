<!DOCTYPE html>
<html lang="pt-br">

<head>

    <!-- ===================================================== -->
    <!-- CONFIGURAÇÕES DA PÁGINA                              -->
    <!-- ===================================================== -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Painel Administrativo | StarCar Premium</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- ===================================================== -->
    <!-- MENU DE NAVEGAÇÃO                                    -->
    <!-- ===================================================== -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="index.html">

                🚗 StarCar Premium

            </a>

        </div>

    </nav>
    <!-- ===================================================== -->
    <!-- PAINEL ADMINISTRATIVO                                -->
    <!-- ===================================================== -->
    <div class="container mt-5">

        <h1 class="text-center">

            Painel Administrativo

        </h1>

        <p class="text-center">

            Gerenciamento de Veículos

        </p>

        <hr>

        <!-- Botão para ir ao cadastro -->
        <div class="text-center mb-4">

            <a href="cadastro.html"
               class="btn btn-success">

                Novo Veículo

            </a>

        </div>

        <!-- Tabela de veículos -->
        <div class="table-responsive">

            <table
                class="table table-striped table-bordered text-center">

                <thead>

                    <tr>

                        <th>Modelo</th>

                        <th>Marca</th>

                        <th>Ano</th>

                        <th>Cor</th>

                        <th>Preço</th>

                        <th>KM</th>

                        <th>Categoria</th>

                        <th>Ações</th>

                    </tr>

                </thead>

                <!-- Dados preenchidos pelo JavaScript -->
                <tbody id="tabelaVeiculos">

                </tbody>

            </table>

        </div>

        <!-- Botão Logout -->
        <div class="text-center mt-4">

            <button
                class="btn btn-danger"
                onclick="sair()">

                Sair

            </button>

        </div>

    </div>
    <!-- ===================================================== -->
    <!-- RODAPÉ                                               -->
    <!-- ===================================================== -->
    <footer
        class="bg-dark text-white text-center p-4 mt-5">

        <p>

            © 2026 StarCar Premium

        </p>

        <p>

            Sistema de gerenciamento de veículos.

        </p>

    </footer>
    <!-- ===================================================== -->
    <!-- PROTEÇÃO DE ACESSO                                   -->
    <!-- ===================================================== -->

    <script>

        /*
        =====================================================
        VERIFICA SE EXISTE LOGIN
        =====================================================
        */

        if(!sessionStorage.getItem("token")){

            window.location.href =
            "login.html";

        }

        /*
        =====================================================
        VERIFICA SE É ADMINISTRADOR
        =====================================================
        */

        let tipoUsuario =

        sessionStorage.getItem("tipo");


        if(tipoUsuario !== "admin"){

            alert(
                "Acesso permitido apenas para administradores!"
            );

            window.location.href =
            "area-usuario.html";

        }

        /*
        =====================================================
        FUNÇÃO LOGOUT
        =====================================================
        */

        function sair(){

            sessionStorage.clear();

            window.location.href =
            "login.html";

        }

    </script>

    <!-- Arquivo responsável pelo CRUD -->
    <script src="js/admin.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
