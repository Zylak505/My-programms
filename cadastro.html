<!-- FORMULÁRIO DE CADASTRO                               -->
<!-- ===================================================== -->

<div class="container mt-5">

    <div class="card shadow p-4">

        <!-- Título -->
        <h2 class="text-center mb-4">
            Cadastro de Veículos
        </h2>

        <!-- Formulário -->
        <form id="formCadastro">

            <!-- Modelo do veículo -->
            <div class="mb-3">

                <label class="form-label">
                    Modelo
                </label>

                <input
                    type="text"
                    id="modelo"
                    class="form-control"
                    placeholder="Ex: Civic"
                    required>

            </div>

            <!-- Marca -->
            <div class="mb-3">

                <label class="form-label">
                    Marca
                </label>

                <input
                    type="text"
                    id="marca"
                    class="form-control"
                    placeholder="Ex: Honda"
                    required>

            </div>

            <!-- Ano -->
            <div class="mb-3">

                <label class="form-label">
                    Ano
                </label>

                <input
                    type="number"
                    id="ano"
                    class="form-control"
                    placeholder="Ex: 2023"
                    required>

            </div>

            <!-- Cor -->
            <div class="mb-3">

                <label class="form-label">
                    Cor
                </label>

                <input
                    type="text"
                    id="cor"
                    class="form-control"
                    placeholder="Ex: Preto"
                    required>

            </div>

            <!-- Preço -->
            <div class="mb-3">

                <label class="form-label">
                    Preço (R$)
                </label>

                <input
                    type="number"
                    id="preco"
                    class="form-control"
                    placeholder="Ex: 120000"
                    required>

            </div>

            <!-- Quilometragem -->
            <div class="mb-3">

                <label class="form-label">
                    Quilometragem
                </label>

                <input
                    type="number"
                    id="km"
                    class="form-control"
                    placeholder="Ex: 35000"
                    required>

            </div>

            <!-- Categoria -->
            <div class="mb-3">

                <label class="form-label">
                    Categoria
                </label>

                <select
                    id="categoria"
                    class="form-select"
                    required>

                    <option value="">
                        Selecione
                    </option>

                    <option value="Sedan">
                        Sedan
                    </option>

                    <option value="SUV">
                        SUV
                    </option>

                    <option value="Hatch">
                        Hatch
                    </option>

                    <option value="Picape">
                        Picape
                    </option>

                    <option value="Esportivo">
                        Esportivo
                    </option>

                </select>

            </div>

            <!-- Botão de cadastro -->
            <div class="text-center">

                <button
                    type="submit"
                    class="btn btn-success btn-lg">

                    Cadastrar Veículo

                </button>

            </div>

        </form>

    </div>

</div>
