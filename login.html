<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow p-4">

                <!-- Título -->
                <h2 class="text-center mb-4">

                    Login do Sistema

                </h2>

                <!-- Formulário -->
                <form id="formLogin">

                    <!-- Campo Email -->
                    <div class="mb-3">

                        <label class="form-label">

                            E-mail

                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Digite seu e-mail"
                            required>

                    </div>

                    <!-- Campo Senha -->
                    <div class="mb-3">

                        <label class="form-label">

                            Senha

                        </label>

                        <input
                            type="password"
                            id="senha"
                            class="form-control"
                            placeholder="Digite sua senha"
                            required>

                    </div>

                    <!-- Botão Login -->
                    <div class="text-center">

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg">

                            Entrar

                        </button>

                    </div>

                </form>

                <!-- Usuários para teste -->
